<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1210" width="1040" height="1210" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Flujo 1 · R1 · Arranque ordenado de la revisión</title><desc id="d">Diagrama de decisión. Llega un archivo; el agente verifica acceso y formato. Si es accesible y su formato está admitido, inicia la revisión y registra el enlace de origen solo si existe. Si no, el caso pasa al flujo 2.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2130"/></marker></defs><rect width="1040" height="1210" fill="#ffffff"/><text x="60" y="38.0" font-size="22" font-weight="700" fill="#1b2130" text-anchor="start" dominant-baseline="central">Flujo 1 · R1 · Arranque ordenado de la revisión</text><text x="60" y="64.0" font-size="14" font-weight="400" fill="#5b6378" text-anchor="start" dominant-baseline="central">Soulless Catcher · Bloque S04-A · Recepción del material</text><rect x="200.0" y="99.0" width="400" height="52" rx="26.0" fill="#1b2130" stroke="#1b2130" stroke-width="2"/><text x="400" y="125.0" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central">INICIO · Llega un archivo para revisar</text><path d="M400,151 L400,196" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="120.0" y="206.0" width="560" height="68" rx="10" fill="#e8f0ff" stroke="#6f98ee" stroke-width="2"/><text x="400" y="230.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">El archivo, su formato y, si el usuario lo aportó,</text><text x="400" y="249.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">el enlace de origen</text><rect x="133.0" y="196.0" width="145.2" height="20" rx="10" fill="#6f98ee"/><text x="205.6" y="206.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">DATOS DE ENTRADA</text><path d="M400,274 L400,322" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="120.0" y="334.0" width="560" height="68" rx="10" fill="#ffffff" stroke="#1b2130" stroke-width="2"/><text x="400" y="358.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Consulta el verificador de archivos:</text><text x="400" y="377.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">¿se puede abrir? ¿qué formato tiene?</text><rect x="133.0" y="324.0" width="178.0" height="20" rx="10" fill="#1b2130"/><text x="222.0" y="334.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">AGENTE · HERRAMIENTA</text><path d="M400,402 L400,446" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><polygon points="400,445.0 615.0,520 400,595.0 185.0,520" fill="#fff4cf" stroke="#cf9a14" stroke-width="2"/><text x="400" y="510.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">¿El archivo es accesible</text><text x="400" y="529.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Y su formato está admitido?</text><path d="M400,595 L400,672" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="413" y="622" width="42" height="24" rx="12" fill="#ffffff" stroke="#2f9e5b" stroke-width="2"/><text x="434" y="634" font-size="13" font-weight="800" fill="#2f9e5b" text-anchor="middle" dominant-baseline="central">SÍ</text><rect x="210.0" y="678.0" width="380" height="56" rx="10" fill="#dff6e6" stroke="#2f9e5b" stroke-width="2"/><text x="400" y="706.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Iniciar la revisión</text><rect x="223.0" y="668.0" width="63.2" height="20" rx="10" fill="#2f9e5b"/><text x="254.6" y="678.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">ACCIÓN</text><path d="M400,734 L400,782" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><polygon points="400,784.0 570.0,836 400,888.0 230.0,836" fill="#fff4cf" stroke="#cf9a14" stroke-width="2"/><text x="400" y="836.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">¿Hay enlace de origen?</text><path d="M400,888 L400,920 L420,920 L420,950" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="433" y="908" width="42" height="24" rx="12" fill="#ffffff" stroke="#2f9e5b" stroke-width="2"/><text x="454" y="920" font-size="13" font-weight="800" fill="#2f9e5b" text-anchor="middle" dominant-baseline="central">SÍ</text><rect x="270.0" y="954.0" width="300" height="56" rx="10" fill="#dff6e6" stroke="#2f9e5b" stroke-width="2"/><text x="420" y="982.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Registrar el enlace de origen</text><rect x="283.0" y="944.0" width="63.2" height="20" rx="10" fill="#2f9e5b"/><text x="314.6" y="954.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">ACCIÓN</text><path d="M230,836 L140,836 L140,950" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="164" y="824" width="42" height="24" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="185" y="836" font-size="13" font-weight="800" fill="#c0392b" text-anchor="middle" dominant-baseline="central">NO</text><rect x="40.0" y="954.0" width="200" height="56" rx="10" fill="#ffffff" stroke="#1b2130" stroke-width="2"/><text x="140" y="982.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Continuar sin enlace</text><path d="M420,1010 L420,1052" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><path d="M140,1010 L140,1080 L232,1080" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="235.0" y="1054.0" width="330" height="52" rx="26.0" fill="#1b2130" stroke="#1b2130" stroke-width="2"/><text x="400" y="1080.0" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central">FIN · La revisión está en marcha</text><path d="M615,520 L690,520" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="641" y="508" width="42" height="24" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="662" y="520" font-size="13" font-weight="800" fill="#c0392b" text-anchor="middle" dominant-baseline="central">NO</text><rect x="690.0" y="466.0" width="320" height="108" rx="10" fill="#f6f7fa" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 4"/><text x="850" y="501.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">La condición no se cumple.</text><text x="850" y="520.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">R1 no se aplica: el caso pasa</text><text x="850" y="539.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">al Flujo 2 (R2).</text><path d="M850,574 L850,626" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="710.0" y="634.0" width="280" height="52" rx="26.0" fill="#1b2130" stroke="#1b2130" stroke-width="2"/><text x="850" y="660.0" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central">FIN · Sigue el flujo 2</text><rect x="690.0" y="735.0" width="320" height="190" rx="10" fill="#f3efff" stroke="#7a5af8" stroke-width="2" stroke-dasharray="7 5"/><text x="850" y="792.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Archivo que se encuentra</text><text x="850" y="811.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">pero está dañado y no se abre:</text><text x="850" y="830.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">se trata como NO accesible</text><text x="850" y="849.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">(decisión D1) y el caso sigue</text><text x="850" y="868.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">por el flujo 2.</text><rect x="703.0" y="725.0" width="104.2" height="20" rx="10" fill="#7a5af8"/><text x="755.1" y="735.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">CASO LÍMITE</text><rect x="690.0" y="965.0" width="320" height="70" rx="10" fill="#e3f6f2" stroke="#1a9c8a" stroke-width="2"/><text x="850" y="990.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">No interviene una persona</text><text x="850" y="1009.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">en este recorrido.</text><rect x="703.0" y="955.0" width="71.4" height="20" rx="10" fill="#1a9c8a"/><text x="738.7" y="965.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">PERSONA</text><text x="60" y="1146" font-size="12" font-weight="700" fill="#5b6378" letter-spacing="0.5">CÓMO LEER EL DIAGRAMA</text><rect x="60" y="1165" width="26" height="22" rx="5" fill="#e8f0ff" stroke="#6f98ee" stroke-width="2"/><text x="94" y="1176" font-size="12.5" fill="#1b2130" dominant-baseline="central">Datos de entrada</text><rect x="222" y="1165" width="26" height="22" rx="5" fill="#ffffff" stroke="#1b2130" stroke-width="2"/><text x="256" y="1176" font-size="12.5" fill="#1b2130" dominant-baseline="central">Acción del agente</text><rect x="391" y="1165" width="26" height="22" rx="5" fill="#fff4cf" stroke="#cf9a14" stroke-width="2"/><text x="425" y="1176" font-size="12.5" fill="#1b2130" dominant-baseline="central">Decisión</text><rect x="497" y="1165" width="26" height="22" rx="5" fill="#dff6e6" stroke="#2f9e5b" stroke-width="2"/><text x="531" y="1176" font-size="12.5" fill="#1b2130" dominant-baseline="central">Resultado</text><rect x="610" y="1165" width="26" height="22" rx="5" fill="#e3f6f2" stroke="#1a9c8a" stroke-width="2"/><text x="644" y="1176" font-size="12.5" fill="#1b2130" dominant-baseline="central">Persona</text><rect x="709" y="1165" width="26" height="22" rx="5" fill="#f3efff" stroke="#7a5af8" stroke-width="2" stroke-dasharray="7 5"/><text x="743" y="1176" font-size="12.5" fill="#1b2130" dominant-baseline="central">Decisión del grupo</text></svg>
