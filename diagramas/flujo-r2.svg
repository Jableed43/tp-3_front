<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1290" width="1040" height="1290" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Flujo 2 · R2 · Archivo no utilizable: explicar y pedir otro</title><desc id="d">Diagrama de decisión. Llega un archivo; el agente verifica acceso y formato. Si no se puede abrir o su formato no está admitido, explica el problema, solicita otro archivo y no emite resultado; tras dos fallos seguidos ofrece ayuda de una persona. Si el archivo es válido, el caso sigue por el flujo 1.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2130"/></marker></defs><rect width="1040" height="1290" fill="#ffffff"/><text x="60" y="38.0" font-size="22" font-weight="700" fill="#1b2130" text-anchor="start" dominant-baseline="central">Flujo 2 · R2 · Archivo no utilizable: explicar y pedir otro</text><text x="60" y="64.0" font-size="14" font-weight="400" fill="#5b6378" text-anchor="start" dominant-baseline="central">Soulless Catcher · Bloque S04-A · Recepción del material</text><rect x="200.0" y="99.0" width="400" height="52" rx="26.0" fill="#1b2130" stroke="#1b2130" stroke-width="2"/><text x="400" y="125.0" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central">INICIO · Llega un archivo para revisar</text><path d="M400,151 L400,196" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="120.0" y="206.0" width="560" height="68" rx="10" fill="#e8f0ff" stroke="#6f98ee" stroke-width="2"/><text x="400" y="230.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">El archivo, si se puede abrir, su formato</text><text x="400" y="249.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">y la lista de formatos admitidos</text><rect x="133.0" y="196.0" width="145.2" height="20" rx="10" fill="#6f98ee"/><text x="205.6" y="206.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">DATOS DE ENTRADA</text><path d="M400,274 L400,322" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="120.0" y="334.0" width="560" height="68" rx="10" fill="#ffffff" stroke="#1b2130" stroke-width="2"/><text x="400" y="358.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Consulta el verificador de archivos:</text><text x="400" y="377.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">¿se puede abrir? ¿qué formato tiene?</text><rect x="133.0" y="324.0" width="178.0" height="20" rx="10" fill="#1b2130"/><text x="222.0" y="334.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">AGENTE · HERRAMIENTA</text><path d="M400,402 L400,446" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><polygon points="400,445.0 625.0,520 400,595.0 175.0,520" fill="#fff4cf" stroke="#cf9a14" stroke-width="2"/><text x="400" y="510.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">¿El archivo NO se puede abrir</text><text x="400" y="529.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">O su formato NO está admitido?</text><path d="M400,595 L400,668" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="413" y="620" width="42" height="24" rx="12" fill="#ffffff" stroke="#2f9e5b" stroke-width="2"/><text x="434" y="632" font-size="13" font-weight="800" fill="#2f9e5b" text-anchor="middle" dominant-baseline="central">SÍ</text><rect x="180.0" y="678.0" width="440" height="76" rx="10" fill="#ffffff" stroke="#1b2130" stroke-width="2"/><text x="400" y="706.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Explicar el problema: qué falló</text><text x="400" y="725.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">y qué formatos se admiten</text><rect x="193.0" y="668.0" width="63.2" height="20" rx="10" fill="#1b2130"/><text x="224.6" y="678.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">ACCIÓN</text><rect x="574.8" y="668" width="30.4" height="20" rx="10" fill="#7a5af8"/><text x="590" y="678" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">D4</text><path d="M400,754 L400,798" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="180.0" y="800.0" width="440" height="56" rx="10" fill="#ffffff" stroke="#1b2130" stroke-width="2"/><text x="400" y="828.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Solicitar otro archivo</text><rect x="193.0" y="790.0" width="63.2" height="20" rx="10" fill="#1b2130"/><text x="224.6" y="800.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">ACCIÓN</text><path d="M400,856 L400,900" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="180.0" y="906.0" width="440" height="60" rx="10" fill="#fde7e3" stroke="#d2604d" stroke-width="2"/><text x="400" y="926.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">No emitir ningún resultado</text><text x="400" y="945.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">(ni veredicto ni puntaje)</text><rect x="193.0" y="896.0" width="104.2" height="20" rx="10" fill="#d2604d"/><text x="245.1" y="906.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">RESTRICCIÓN</text><path d="M400,966 L400,1010" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><polygon points="400,1015.0 600.0,1064 400,1113.0 200.0,1064" fill="#f3efff" stroke="#7a5af8" stroke-width="2" stroke-dasharray="7 5"/><text x="400" y="1054.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">¿Es el segundo archivo</text><text x="400" y="1073.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">seguido que falla?</text><rect x="148.7" y="1020" width="202.6" height="20" rx="10" fill="#7a5af8"/><text x="250" y="1030" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">DECISIÓN DEL GRUPO · D3</text><path d="M200,1064 L180,1064 L180,1126" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="141" y="1052" width="42" height="24" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="162" y="1064" font-size="13" font-weight="800" fill="#c0392b" text-anchor="middle" dominant-baseline="central">NO</text><rect x="65.0" y="1128.0" width="230" height="64" rx="10" fill="#ffffff" stroke="#1b2130" stroke-width="2"/><text x="180" y="1150.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Esperar un nuevo envío</text><text x="180" y="1169.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">(vuelve al inicio)</text><path d="M600,1064 L690,1064" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="617" y="1052" width="42" height="24" rx="12" fill="#ffffff" stroke="#2f9e5b" stroke-width="2"/><text x="638" y="1064" font-size="13" font-weight="800" fill="#2f9e5b" text-anchor="middle" dominant-baseline="central">SÍ</text><rect x="690.0" y="1026.0" width="320" height="76" rx="10" fill="#e3f6f2" stroke="#1a9c8a" stroke-width="2"/><text x="850" y="1054.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Ofrecer ayuda de una persona</text><text x="850" y="1073.5" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">de soporte</text><rect x="703.0" y="1016.0" width="71.4" height="20" rx="10" fill="#1a9c8a"/><text x="738.7" y="1026.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">PERSONA</text><path d="M850,1102 L850,1136" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="710.0" y="1140.0" width="280" height="52" rx="26.0" fill="#1b2130" stroke="#1b2130" stroke-width="2"/><text x="850" y="1166.0" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central">FIN · Atiende una persona</text><path d="M625,520 L690,520" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="647" y="508" width="42" height="24" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="668" y="520" font-size="13" font-weight="800" fill="#c0392b" text-anchor="middle" dominant-baseline="central">NO</text><rect x="690.0" y="466.0" width="320" height="108" rx="10" fill="#f6f7fa" stroke="#8b93a7" stroke-width="2" stroke-dasharray="4 4"/><text x="850" y="501.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">El archivo es válido.</text><text x="850" y="520.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">R2 no se aplica: el caso</text><text x="850" y="539.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">sigue por el Flujo 1 (R1).</text><path d="M850,574 L850,626" fill="none" stroke="#1b2130" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#flecha)"/><rect x="710.0" y="634.0" width="280" height="52" rx="26.0" fill="#1b2130" stroke="#1b2130" stroke-width="2"/><text x="850" y="660.0" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle" dominant-baseline="central">FIN · Sigue el flujo 1</text><rect x="690.0" y="755.0" width="320" height="150" rx="10" fill="#f3efff" stroke="#7a5af8" stroke-width="2" stroke-dasharray="7 5"/><text x="850" y="811.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">Falla por los dos motivos</text><text x="850" y="830.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">a la vez: se explican ambos</text><text x="850" y="849.0" font-size="15" font-weight="400" fill="#1b2130" text-anchor="middle" dominant-baseline="central">en un mismo mensaje.</text><rect x="703.0" y="745.0" width="104.2" height="20" rx="10" fill="#7a5af8"/><text x="755.1" y="755.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="0.4">CASO LÍMITE</text><text x="60" y="1232" font-size="12" font-weight="700" fill="#5b6378" letter-spacing="0.5">CÓMO LEER EL DIAGRAMA</text><rect x="60" y="1251" width="26" height="22" rx="5" fill="#e8f0ff" stroke="#6f98ee" stroke-width="2"/><text x="94" y="1262" font-size="12.5" fill="#1b2130" dominant-baseline="central">Datos de entrada</text><rect x="222" y="1251" width="26" height="22" rx="5" fill="#ffffff" stroke="#1b2130" stroke-width="2"/><text x="256" y="1262" font-size="12.5" fill="#1b2130" dominant-baseline="central">Acción del agente</text><rect x="391" y="1251" width="26" height="22" rx="5" fill="#fff4cf" stroke="#cf9a14" stroke-width="2"/><text x="425" y="1262" font-size="12.5" fill="#1b2130" dominant-baseline="central">Decisión</text><rect x="497" y="1251" width="26" height="22" rx="5" fill="#dff6e6" stroke="#2f9e5b" stroke-width="2"/><text x="531" y="1262" font-size="12.5" fill="#1b2130" dominant-baseline="central">Resultado</text><rect x="610" y="1251" width="26" height="22" rx="5" fill="#fde7e3" stroke="#d2604d" stroke-width="2"/><text x="644" y="1262" font-size="12.5" fill="#1b2130" dominant-baseline="central">Restricción</text><rect x="737" y="1251" width="26" height="22" rx="5" fill="#e3f6f2" stroke="#1a9c8a" stroke-width="2"/><text x="771" y="1262" font-size="12.5" fill="#1b2130" dominant-baseline="central">Persona</text><rect x="836" y="1251" width="26" height="22" rx="5" fill="#f3efff" stroke="#7a5af8" stroke-width="2" stroke-dasharray="7 5"/><text x="870" y="1262" font-size="12.5" fill="#1b2130" dominant-baseline="central">Decisión del grupo</text></svg>
